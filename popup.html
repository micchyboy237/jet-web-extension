<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jet Extension</title>
    <style>
      :root {
        --primary: #6366f1;
        --primary-dark: #4f46e5;
        --bg: #f8fafc;
      }
      * {
        box-sizing: border-box;
      }
      body {
        width: 340px;
        margin: 0;
        padding: 24px 20px;
        font-family: system-ui, sans-serif;
        background: var(--bg);
        color: #1e293b;
      }
      h1 {
        margin: 0 0 1.6rem;
        font-size: 1.8rem;
        font-weight: 800;
        letter-spacing: -0.5px;
        text-align: center;
      }
      button {
        width: 100%;
        padding: 14px;
        margin-bottom: 12px;
        font-size: 1.05rem;
        font-weight: 600;
        color: white;
        background: var(--primary);
        border: none;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.18s;
      }
      button:hover {
        background: var(--primary-dark);
        transform: translateY(-1px);
      }
      button:active {
        transform: translateY(0);
      }
      #status {
        margin-top: 1rem;
        text-align: center;
        color: #64748b;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <h1>Jet Tools</h1>

    <button id="btn-tabs">View Open Tabs</button>
    <button id="btn-copy-html">Copy Current Tab HTML</button>
    <button id="btn-history">View History</button>
    <button id="btn-network">Network History</button>

    <div id="status"></div>

    <script src="popup.js"></script>
  </body>
</html>

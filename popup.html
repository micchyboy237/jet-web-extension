<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jet Extension</title>
    <style>
      :root {
        --primary: #6366f1;
        --primary-dark: #4f46e5;
        --bg: #f8fafc;
      }
      * {
        box-sizing: border-box;
      }
      body {
        width: 340px;
        margin: 0;
        padding: 24px 20px;
        font-family: system-ui, sans-serif;
        background: var(--bg);
        color: #1e293b;
      }
      h1 {
        margin: 0 0 1.6rem;
        font-size: 1.8rem;
        font-weight: 800;
        letter-spacing: -0.5px;
        text-align: center;
      }
      button {
        width: 100%;
        padding: 14px;
        margin-bottom: 12px;
        font-size: 1.05rem;
        font-weight: 600;
        color: white;
        background: var(--primary);
        border: none;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.18s;
      }
      button:hover {
        background: var(--primary-dark);
        transform: translateY(-1px);
      }
      button:active {
        transform: translateY(0);
      }
      #status {
        margin-top: 1rem;
        text-align: center;
        color: #64748b;
        font-size: 0.9rem;
      }
      #btn-reset-zoom:hover {
        background: #5a6268;
        transform: scale(1.08);
      }

      #btn-reset-zoom:active {
        transform: scale(0.96);
      }
    </style>
  </head>
  <body>
    <h1>Jet Tools</h1>

    <div style="margin: 20px 0 16px">
      <!-- Header row: title left + reset right -->
      <div
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 12px;
        "
      >
        <div
          style="
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
          "
        >
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <span>Page Zoom</span>
        </div>

        <button
          id="btn-reset-zoom"
          title="Reset to your default zoom"
          style="
            width: 36px;
            height: 36px;
            padding: 0;
            border-radius: 50%;
            background: #6c757d;
            color: white;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.18s;
            flex-shrink: 0;
          "
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
            <path d="M3 3v5h5" />
          </svg>
        </button>
      </div>

      <!-- Zoom options row – prevent overflow -->
      <div
        style="
          display: flex;
          flex-wrap: nowrap;
          justify-content: space-between;
          align-items: center;
          width: 100%;
          gap: 8px;
        "
      >
        <label
          style="
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            font-size: 0.92rem;
            white-space: nowrap;
            flex-shrink: 1;
          "
        >
          <input type="radio" name="zoom-level" value="0.8" />
          80%
        </label>
        <label
          style="
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            font-size: 0.92rem;
            white-space: nowrap;
            flex-shrink: 1;
          "
        >
          <input type="radio" name="zoom-level" value="1" checked />
          100%
        </label>
        <label
          style="
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            font-size: 0.92rem;
            white-space: nowrap;
            flex-shrink: 1;
          "
        >
          <input type="radio" name="zoom-level" value="1.5" />
          150%
        </label>
        <label
          style="
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            font-size: 0.92rem;
            white-space: nowrap;
            flex-shrink: 1;
          "
        >
          <input type="radio" name="zoom-level" value="2" />
          200%
        </label>
      </div>
    </div>

    <label
      style="display: flex; align-items: center; gap: 10px; margin-bottom: 14px"
    >
      <input type="checkbox" id="toggle-dedup" />
      <span>Auto close duplicate tabs</span>
    </label>

    <button id="btn-dedup-now">Deduplicate Tabs Now</button>

    <button id="btn-tabs">View Open Tabs</button>
    <button id="btn-copy-html">Copy Current Tab HTML</button>
    <button id="btn-history">View History</button>
    <button id="btn-network">Network History</button>
    <button id="btn-summarize">Summarize Page (AI)</button>

    <div id="status"></div>

    <script src="popup.js"></script>
  </body>
</html>

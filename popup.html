<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jet Extension</title>
    <style>
      :root {
        --primary: #6366f1;
        --primary-dark: #4f46e5;
        --bg: #f8fafc;
      }
      * {
        box-sizing: border-box;
      }
      body {
        width: 340px;
        margin: 0;
        padding: 24px 20px;
        font-family: system-ui, sans-serif;
        background: var(--bg);
        color: #1e293b;
      }
      h1 {
        margin: 0 0 1.6rem;
        font-size: 1.8rem;
        font-weight: 800;
        letter-spacing: -0.5px;
        text-align: center;
      }
      button {
        width: 100%;
        padding: 14px;
        margin-bottom: 12px;
        font-size: 1.05rem;
        font-weight: 600;
        color: white;
        background: var(--primary);
        border: none;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.18s;
      }
      button:hover {
        background: var(--primary-dark);
        transform: translateY(-1px);
      }
      button:active {
        transform: translateY(0);
      }
      #status {
        margin-top: 1rem;
        text-align: center;
        color: #64748b;
        font-size: 0.9rem;
      }
      #btn-reset-zoom:hover {
        background: #5a6268;
        transform: scale(1.08);
      }

      #btn-reset-zoom:active {
        transform: scale(0.96);
      }
    </style>
  </head>
  <body>
    <h1>Jet Tools</h1>

    <label
      style="display: flex; align-items: center; gap: 10px; margin-bottom: 14px"
    >
      <input type="checkbox" id="toggle-dedup" />
      <span>Auto close duplicate tabs</span>
    </label>

    <button id="btn-dedup-now">Deduplicate Tabs Now</button>

    <button id="btn-tabs">View Open Tabs</button>
    <button id="btn-copy-html">Copy Current Tab HTML</button>
    <button id="btn-history">View History</button>
    <button id="btn-network">Network History</button>

    <label
      style="
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 20px 0 10px;
        font-weight: 500;
        font-size: 1.05rem;
      "
    >
      <span style="font-size: 1.3rem">🔍</span>
      <span>Page Zoom:</span>
      <select
        id="zoom-select"
        style="
          padding: 8px 12px;
          border-radius: 8px;
          border: 1px solid #ccc;
          font-size: 1rem;
          flex: 1;
          min-width: 140px;
        "
      >
        <option value="0">Reset to default</option>
        <option value="0.5">50%</option>
        <option value="0.75">75%</option>
        <option value="1">100%</option>
        <option value="1.25">125%</option>
        <option value="1.5">150%</option>
        <option value="2">200%</option>
      </select>

      <button
        id="btn-reset-zoom"
        title="Reset to your default zoom (currently 80%)"
        style="
          width: 36px;
          height: 36px;
          padding: 0;
          border-radius: 50%;
          background: #6c757d;
          color: white;
          border: none;
          cursor: pointer;
          flex-shrink: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          transition: all 0.18s;
        "
      >
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
          <path d="M3 3v5h5" />
        </svg>
      </button>
    </label>

    <div id="status"></div>

    <script src="popup.js"></script>
  </body>
</html>

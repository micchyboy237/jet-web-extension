<!-- Jet_Apps/web-extensions/jet-web-extension/summarization.html -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Summarizer – Jet Extension</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 16px 20px;
        background: #f8fafc;
        color: #1e293b;
        line-height: 1.5;
      }
      h1 {
        margin: 0 0 1rem;
        font-size: 1.6rem;
      }
      #status {
        margin: 1rem 0;
        font-weight: 500;
        min-height: 1.4em;
      }
      #summary {
        white-space: pre-wrap;
        background: white;
        padding: 16px;
        border-radius: 8px;
        border: 1px solid #e2e8f0;
        min-height: 200px;
        max-height: 80vh;
        overflow-y: auto;
        font-family: ui-monospace, monospace;
        line-height: 1.6;
      }
      #copy-btn {
        margin-top: 16px;
        padding: 10px 16px;
        background: #6366f1;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
      }
      #copy-btn:hover {
        background: #4f46e5;
      }
    </style>
  </head>
  <body>
    <h1>Page Summary (Local LLM)</h1>
    <div id="status">Initializing...</div>
    <div id="summary"></div>
    <button id="copy-btn" style="display: none">Copy Summary</button>

    <script src="summarization.js"></script>
  </body>
</html>
